[app]
poll_interval = 5
history_length = 40
# Color theme; run `dgx-top themes` for the full list of supported themes.
theme = "dgx-dark"
# Meter treatment for the GPU / memory / KV% bars (one value for all):
#   gradient = btop-style green→red ramp (default)
#   spark    = sparkline of the metric's recent history
#   tick     = dim scale with a single bright marker at the current value
#   line     = thin hairline fill over a hairline track
meter_treatment = "gradient"
# Decode chart renderer in the SERVING pane:
#   area         = four-row ramp-coloured strip, no gutter or overlays
#                  (default; the reference footer)
#   oscilloscope = dim graticule, bright leading window, edge markers and
#                  inline labels, Δ5 slope readout; fills the spare height
#   lines        = legacy smooth braille lines with translucent fills; also
#                  fills the spare height
chart = "area"
# Quiet mode: calm the whole UI — identity hues render neutral and colour
# appears only on caution/critical. Composes with any meter treatment.
quiet = false
# Default GPU clock ceiling (MHz) for the `c` clocks menu, which applies it as
# `sudo -n nvidia-smi -lgc 0,<ceiling>` on every node (needs passwordless sudo
# for nvidia-smi on the nodes; nothing else in dgx-top uses sudo). The menu
# opens on the lock already recorded on the nodes, if any, and ←/→ move it in
# 100 MHz steps before applying.
clock_ceiling_mhz = 2200
# Physical memory of each node in GiB (default 128). The memory bar shows what
# Linux's MemTotal does not (firmware / GPU carve-out) as "reserved".
phys_gib = 128

# ssh_target accepts either user@host or an alias from ~/.ssh/config.
# vllm_url is the inference-engine base URL, accessed directly from the machine
# running dgx-top.
# engine is optional: "vllm", "sglang" or "tensorfold". Leave it out and dgx-top
# detects the engine from the endpoint's own metrics. Declaring "vllm" or
# "tensorfold" skips SGLang's load-API probes.
# log is optional: where the engine's startup log is read from (over SSH) to
# split memory into weights / graphs / KV. Leave it out to follow the log of
# the process listening on vllm_url's port; "off" never reads one;
# "docker:<container>" reads `docker logs <container>`; an absolute path reads
# that file on the node, e.g. log = "/srv/engine/logs/rank-0.log".
[[nodes]]
label = "spark-1"
ssh_target = "spark@spark01.example.com"
vllm_url = "http://spark01.example.com:8000"
worker = false

[[nodes]]
label = "spark-2"
ssh_target = "spark@spark02.example.com"
vllm_url = "http://spark02.example.com:8000"
worker = true
