[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dgx-top"
version = "0.1.0"
description = "Agentless terminal monitoring for NVIDIA DGX Spark clusters"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "dgx-top contributors" }]
keywords = ["dgx", "nvidia", "spark", "vllm", "monitoring", "tui"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "textual>=1.0.0,<9",
    "httpx>=0.25.0",
    "rich>=13.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23",
    "ruff>=0.9",
]

[project.scripts]
dgx-top = "cli:main"

[project.urls]
Homepage = "https://github.com/justincasey/dgx-top"
Repository = "https://github.com/justincasey/dgx-top"
Issues = "https://github.com/justincasey/dgx-top/issues"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["app", "cli", "collector", "config", "preflight", "stats", "themes"]

[tool.setuptools.data-files]
"share/dgx-top" = ["src/config.example.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E741"]
